    function App() {
      const [data, setData] = useState(() => {
        const stored = localStorage.getItem("classroom_app_data_v2");
        return stored ? JSON.parse(stored) : INITIAL_DATA;
      });

      const [currentRole, setCurrentRole] = useState("student"); // student | teacher | parent
      const [activeTab, setActiveTab] = useState("dashboard"); // dashboard | lessons | quiz | leaderboard | feed
      const [activeQuizModal, setActiveQuizModal] = useState(null);
      const [activeSandboxModal, setActiveSandboxModal] = useState(null);
      const [toast, setToast] = useState(null);

      // Save state to localStorage
      useEffect(() => {
        localStorage.setItem("classroom_app_data_v2", JSON.stringify(data));
      }, [data]);

      // Trigger Lucide Icons refresh after render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Gamification: Add XP & Check Level Up
      const addXP = (amount) => {
        setData(prev => {
          const newXP = prev.currentUser.xp + amount;
          const newLevel = Math.floor(newXP / 150) + 1;
          const leveledUp = newLevel > prev.currentUser.level;

          if (leveledUp && window.confetti) {
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            showToast(`🎉 CHÚC MỪNG! Bạn đã thăng cấp LEVEL ${newLevel}! +${amount} XP`, "level");
          } else {
            showToast(`⚡ +${amount} XP Kinh nghiệm vừa được cộng!`, "success");
          }

          return {
            ...prev,
            currentUser: {
              ...prev.currentUser,
              xp: newXP,
              level: newLevel
            }
          };
        });
      };

      return (
        <div class="min-h-screen flex flex-col bg-slate-50">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 font-semibold transition-all transform animate-bounce ${
              toast.type === "level" ? "bg-amber-500 text-white shadow-amber-300" : "bg-emerald-600 text-white shadow-emerald-200"
            }`}>
              <i data-lucide={toast.type === "level" ? "trophy" : "sparkles"} class="w-6 h-6"></i>
              <span>{toast.message}</span>
            </div>
          )}

              {/* LOGO */}
              <div class="flex items-center gap-3">

                  <i data-lucide="graduation-cap" class="w-7 h-7"></i>
                </div>
                <div>
                  <h1 class="text-xl font-extrabold bg-gradient-to-r from-teal-700 to-emerald-600 bg-clip-text text-transparent">
                    Classroom App
                  </h1>
                  <p class="text-xs text-slate-500 font-medium">Học Tập Gamification & Quản Lý Lớp</p>
                </div>
              </div>

              {/* GAMIFICATION STATS (STUDENT MODE) */}
              {currentRole === "student" && (
                <div class="hidden md:flex items-center gap-4 bg-slate-100/80 px-4 py-2 rounded-2xl border border-slate-200/60">
                  <div class="flex items-center gap-2">
                    <span class="w-8 h-8 rounded-xl bg-amber-500 text-white font-black text-sm flex items-center justify-center shadow-sm">
                      L{data.currentUser.level}
                    </span>
                    <div>
                      <div class="flex justify-between text-xs font-bold text-slate-700">
                        <span>Cấp Độ {data.currentUser.level}</span>
                        <span class="text-amber-600 font-extrabold">{data.currentUser.xp} XP</span>
                      </div>
                      <div class="w-28 bg-slate-200 h-2 rounded-full overflow-hidden mt-0.5">
                        <div 
                          class="bg-gradient-to-r from-amber-400 to-amber-500 h-full rounded-full transition-all duration-500"
                          style={{ width: `${Math.min(100, ((data.currentUser.xp % 150) / 150) * 100)}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div class="h-6 w-px bg-slate-300"></div>

                  <div class="flex items-center gap-1.5 font-extrabold text-xs text-orange-600">
                    <i data-lucide="flame" class="w-5 h-5 text-orange-500 fill-orange-500 animate-pulse"></i>
                    <span>{data.currentUser.streak_days} Ngày Streak</span>
                  </div>
                </div>
              )}

              {/* ROLE SWITCHER DROPDOWN */}
              <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                  <p class="text-xs text-slate-400 font-medium">Đang chế độ xem:</p>
                  <p class="text-xs font-bold text-teal-700">
                    {currentRole === "student" && "🎓 Học Sinh (Nguyễn Văn An)"}
                    {currentRole === "teacher" && "👨‍🏫 Giáo Viên (Thầy Cường)"}
                    {currentRole === "parent" && "👨‍👩‍👧 Cổng Tra Cứu Phụ Huynh"}
                  </p>
                </div>

                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                  <button 
                    onClick={() => { setCurrentRole("student"); setActiveTab("dashboard"); }}
                    class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      currentRole === "student" ? "bg-white text-teal-700 shadow-sm" : "text-slate-600 hover:text-slate-900"
                    }`}
                  >
                    Học Sinh
                  </button>
                  <button 
                    onClick={() => { setCurrentRole("teacher"); setActiveTab("dashboard"); }}
                    class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      currentRole === "teacher" ? "bg-white text-teal-700 shadow-sm" : "text-slate-600 hover:text-slate-900"
                    }`}
                  >
                    Giáo Viên
                  </button>
                  <button 
                    onClick={() => { setCurrentRole("parent"); setActiveTab("dashboard"); }}
                    class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      currentRole === "parent" ? "bg-white text-teal-700 shadow-sm" : "text-slate-600 hover:text-slate-900"
                    }`}
                  >
                    Phụ Huynh
                  </button>
                </div>
              </div>

            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {/* STUDENT DASHBOARD VIEW */}
            {currentRole === "student" && (
              <StudentDashboard 
                data={data} 
                setData={setData}
                activeTab={activeTab}
                setActiveTab={setActiveTab}
                onOpenQuiz={(quiz) => setActiveQuizModal(quiz)}
                onOpenSandbox={(lesson) => setActiveSandboxModal(lesson)}
                addXP={addXP}
              />
            )}

            {/* TEACHER DASHBOARD VIEW */}
            {currentRole === "teacher" && (
              <TeacherDashboard 
                data={data} 
                setData={setData} 
                showToast={showToast}
              />
            )}

            {/* PARENT PORTAL LOOKUP VIEW */}
            {currentRole === "parent" && (
              <ParentPortal 
                data={data}
              />
            )}

          </main>

          {/* QUIZ PLAYER MODAL */}
          {activeQuizModal && (
            <QuizPlayerModal 
              quiz={activeQuizModal} 
              onClose={() => setActiveQuizModal(null)}
              onFinish={(score, correctCount, totalCount) => {
                const xpEarned = Math.round((score / 10) * activeQuizModal.xp_reward);
                addXP(xpEarned);
                
                // Add submission to record
                const newSub = {
                  id: "sub-" + Date.now(),
                  student_code: data.currentUser.student_code,
                  student_name: data.currentUser.full_name,
                  quiz_title: activeQuizModal.title,
                  score: score,
                  correct_answers: correctCount,
                  total_questions: totalCount,
                  xp_earned: xpEarned,
                  submitted_at: new Date().toLocaleString("vi-VN")
                };

                setData(prev => ({
                  ...prev,
                  quizSubmissions: [newSub, ...prev.quizSubmissions]
                }));
              }}
            />
          )}

          {/* IFRAME SANDBOX AN TOÀN MODAL */}
          {activeSandboxModal && (
            <SandboxModal 
              lesson={activeSandboxModal} 
              onClose={() => setActiveSandboxModal(null)} 
            />
          )}

          {/* FOOTER ARCHITECTURE BAR */}
          <footer class="bg-white border-t border-slate-200 py-6 mt-12">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
              <p class="font-bold text-slate-700">Dự án Classroom App • Thiết kế theo chuẩn Sơ đồ 4 Tầng Kiến trúc</p>
              <p class="mt-1">Frontend React SPA • Supabase Auth & RLS Guard • iFrame Sandbox • Quiz & Gamification Engine • PostgreSQL DB</p>
            </div>
          </footer>
        </div>
      );
    }

      const [joinCodeInput, setJoinCodeInput] = useState("");
      const [showJoinModal, setShowJoinModal] = useState(false);

      return (
        <div class="space-y-8">
          {/* HERO BANNER GAMIFIED */}
          <div class="bg-gradient-to-r from-teal-600 via-emerald-600 to-teal-800 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="relative z-10 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
              <div>
                <span class="bg-white/20 text-white text-xs font-extrabold px-3.5 py-1.5 rounded-full uppercase tracking-wider">
                  Xin chào, {data.currentUser.full_name}! 👋

                <h2 class="text-2xl sm:text-3xl font-black mt-3">

                  Hoàn thành các bài Quiz trắc nghiệm và trải nghiệm game mô phỏng sinh động để tích lũy XP thăng cấp Level!
                </p>
              </div>

              <button 
                onClick={() => setShowJoinModal(true)}

              >
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span>Nhập Mã Tham Gia Lớp</span>
              </button>
            </div>
          </div>

          {/* TAB NAVIGATION */}
          <div class="flex border-b border-slate-200 overflow-x-auto gap-2">
            {[
              { id: "dashboard", label: "Lớp Học & Học Liệu", icon: "book-open" },
              { id: "quiz", label: "Thử Thách Quiz", icon: "zap" },
              { id: "leaderboard", label: "Bảng Xếp Hạng", icon: "trophy" },
              { id: "badges", label: "Bộ Sưu Tập Huy Hiệu", icon: "award" },
              { id: "feed", label: "Bảng Tin Lớp Học", icon: "message-square" }

                  activeTab === tab.id 
                    ? "border-teal-600 text-teal-700 bg-teal-50/50 rounded-t-xl" 
                    : "border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300"
                }`}

            <p class="text-xs text-slate-300 mt-1">Nhập Mã Học Sinh của con em để xem ngay Báo cáo Điểm danh, Điểm số Quiz & Lời nhắn từ Giáo viên.</p>
            
            <div class="flex flex-col sm:flex-row gap-3 mt-6">
              <input 
                type="text" 
                value={searchCode}
                onChange={(e) => setSearchCode(e.target.value)}
                placeholder="Nhập Mã HS (VD: HS2026001)" 
                class="flex-1 bg-white text-slate-900 font-mono font-black text-sm uppercase px-4 py-3 rounded-2xl border-none outline-none"
              />
              <button 
                onClick={handleSearch}
                class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs shadow-md transition-all shrink-0"
              >
                Tra Cứu Ngay
              </button>
            </div>
          </div>

          {/* REPORT RESULT CARD */}
          {foundStudent && (
            <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-8">
              {/* STUDENT BRIEF */}
              <div class="flex items-center justify-between border-b border-slate-100 pb-6">
                <div>
                  <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Học Sinh Tra Cứu</span>
                  <h3 class="text-2xl font-black text-slate-900">{foundStudent.full_name}</h3>
                  <p class="text-xs text-slate-500 mt-1">Mã Học Sinh: <strong class="text-slate-800">{foundStudent.student_code}</strong> • Ngày sinh: {foundStudent.dob}</p>
                </div>
                <div class="text-right">
                  <span class="bg-amber-100 text-amber-900 font-extrabold text-xs px-3.5 py-1.5 rounded-full">
                    Cấp Độ L{foundStudent.level}
                  </span>
                  <span class="block text-sm font-black text-amber-600 mt-1">{foundStudent.xp} XP tích lũy</span>
                </div>
              </div>

              {/* REPORT GRID */}
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-emerald-50 rounded-2xl p-5 border border-emerald-200">
                  <p class="text-xs text-emerald-700 font-extrabold uppercase">Tình Trạng Điểm Danh</p>
                  <p class="text-xl font-black text-emerald-900 mt-2">
                    {foundStudent.status === "present" ? "✅ Có Mặt Hôm Nay" : "⚠️ Vắng / Phép"}
                  </p>
                  <p class="text-[11px] text-emerald-700 mt-1">Chuỗi đi học chuyên cần: {foundStudent.streak} ngày liên tiếp</p>
                </div>

                <div class="bg-sky-50 rounded-2xl p-5 border border-sky-200">
                  <p class="text-xs text-sky-700 font-extrabold uppercase">Bài Quiz Gần Nhất</p>
                  <p class="text-xl font-black text-sky-900 mt-2">10.0 / 10 Điểm</p>
                  <p class="text-[11px] text-sky-700 mt-1">Ôn Tập Phương Trình Bậc Hai Toán 9</p>
                </div>

                <div class="bg-amber-50 rounded-2xl p-5 border border-amber-200">
                  <p class="text-xs text-amber-700 font-extrabold uppercase">Huy Hiệu Tích Lũy</p>
                  <p class="text-xl font-black text-amber-900 mt-2">3 Huy Hiệu</p>
                  <p class="text-[11px] text-amber-700 mt-1">🥇 Chăm Học • ⚡ Vua Quiz • 🚀 Thần Đồng</p>
                </div>
              </div>

              {/* TEACHER NOTE */}
              <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200">
                <h4 class="font-extrabold text-slate-800 text-xs uppercase mb-2">Nhận Xét Của Giáo Viên Chủ Nhiệm</h4>
                <p class="text-xs text-slate-600 leading-relaxed italic">
                  "Em Nguyễn Văn An học tập rất chăm chỉ, phát biểu sôi nổi trong giờ Toán và hoàn thành xuất sắc các bài tập mô phỏng tương tác trên ứng dụng."
                </p>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- QUIZ PLAYER MODAL COMPONENT ---
    function QuizPlayerModal({ quiz, onClose, onFinish }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [answers, setAnswers] = useState([]);
      const [showResult, setShowResult] = useState(false);
      const [timeLeft, setTimeLeft] = useState(quiz.duration_minutes * 60);

      // Countdown Timer
      useEffect(() => {
        if (showResult) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              handleSubmitQuiz();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [showResult]);

      const currentQ = quiz.questions[currentQIndex];

      const handleNextQuestion = () => {
        const newAns = [...answers, selectedOption];
        setAnswers(newAns);
        setSelectedOption(null);

        if (currentQIndex < quiz.questions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
        } else {
          // Finish quiz
          calculateScore(newAns);
        }
      };

      const calculateScore = (finalAns) => {
        let correct = 0;
        quiz.questions.forEach((q, idx) => {
          if (finalAns[idx] === q.correct_option) {
            correct++;
          }
        });

        const scoreVal = Math.round((correct / quiz.questions.length) * 100) / 10;
        setShowResult(true);
        onFinish(scoreVal, correct, quiz.questions.length);
      };

      return (
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto custom-scrollbar">
            
            {!showResult ? (
              <>
                {/* QUIZ TIMER HEADER */}
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                  <div>
                    <span class="text-xs text-amber-600 font-extrabold uppercase">Thử Thách Quiz</span>
                    <h3 class="text-lg font-black text-slate-900">{quiz.title}</h3>
                  </div>
                  <div class="bg-amber-100 text-amber-900 font-black text-xs px-3.5 py-1.5 rounded-full flex items-center gap-1.5">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>{Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, "0")}</span>
                  </div>
                </div>

                {/* QUESTION PROGRESS */}
                <div class="flex items-center justify-between text-xs font-extrabold text-slate-500">
                  <span>Câu hỏi {currentQIndex + 1} / {quiz.questions.length}</span>
                  <span>+{quiz.xp_reward} XP Thưởng</span>
                </div>

                {/* QUESTION TEXT */}
                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                  <h4 class="font-bold text-slate-900 text-base sm:text-lg leading-relaxed">{currentQ.question_text}</h4>
                </div>

                {/* OPTIONS */}
                <div class="space-y-3">
                  {currentQ.options.map((opt, idx) => (
                    <button
                      key={idx}
                      onClick={() => setSelectedOption(idx)}
                      class={`w-full p-4 rounded-2xl border-2 text-left font-semibold text-sm transition-all flex items-center justify-between ${
                        selectedOption === idx 
                          ? "border-amber-500 bg-amber-50 text-amber-950 shadow-sm" 
                          : "border-slate-200 hover:border-slate-300 text-slate-800"
                      }`}
                    >
                      <span>{opt}</span>
                      <span class={`w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-bold ${
                        selectedOption === idx ? "border-amber-500 bg-amber-500 text-white" : "border-slate-300"
                      }`}>
                        {String.fromCharCode(65 + idx)}
                      </span>
                    </button>
                  ))}
                </div>

                {/* BUTTON NEXT */}
                <div class="pt-4 flex justify-between">
                  <button onClick={onClose} class="px-5 py-2.5 text-xs font-bold text-slate-500 hover:text-slate-800">
                    Hủy Làm Bài
                  </button>
                  <button 
                    disabled={selectedOption === null}
                    onClick={handleNextQuestion}
                    class="bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-black px-6 py-3 rounded-xl text-xs shadow-md transition-all"
                  >
                    {currentQIndex === quiz.questions.length - 1 ? "Nộp Bài" : "Câu Tiếp Theo ➔"}
                  </button>
                </div>
              </>
            ) : (
              /* RESULT SUMMARY SCREEN */
              <div class="text-center py-6 space-y-6">
                <div class="w-20 h-20 bg-emerald-100 rounded-full text-emerald-600 flex items-center justify-center mx-auto animate-bounce">
                  <i data-lucide="trophy" class="w-10 h-10"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-900">Hoàn Thành Thử Thách Quiz!</h3>
                <p class="text-xs text-slate-500">Bạn đã xuất sắc nhận được điểm thưởng XP kinh nghiệm!</p>

                <div class="bg-amber-50 border border-amber-200 p-6 rounded-3xl max-w-sm mx-auto">
                  <span class="text-xs text-amber-800 font-extrabold uppercase">Kết Quả Điểm Số</span>
                  <p class="text-4xl font-black text-amber-600 mt-1">10.0 / 10</p>
                  <p class="text-xs text-emerald-700 font-bold mt-2">🎉 +100 XP Thưởng Đã Được Cộng Vào Hồ Sơ!</p>
                </div>

                <button 
                  onClick={onClose}
                  class="bg-teal-600 hover:bg-teal-700 text-white font-extrabold px-8 py-3 rounded-2xl text-xs shadow-lg"
                >
                  Trở Về Bảng Điều Khiển
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    // --- IFRAME SANDBOX MODAL COMPONENT ---
    function SandboxModal({ lesson, onClose }) {
      return (
        <div class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-6">
          <div class="bg-slate-900 rounded-3xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden shadow-2xl border border-slate-700">
            <div class="bg-slate-800 px-6 py-4 flex items-center justify-between border-b border-slate-700">
              <div class="flex items-center gap-3">
                <span class="bg-amber-500/20 text-amber-400 font-extrabold text-xs px-3 py-1 rounded-full flex items-center gap-1">
                  <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> iFrame Sandbox An Toàn
                </span>
                <h3 class="text-white font-extrabold text-sm truncate">{lesson.title}</h3>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-white font-bold p-1">
                <i data-lucide="x" class="w-6 h-6"></i>
              </button>
            </div>
            
            <div class="flex-1 bg-black">
              <iframe 
                src={lesson.embed_url} 
                title={lesson.title}
                sandbox="allow-scripts allow-same-origin"
                class="w-full h-full border-none"
              ></iframe>
            </div>
          </div>
        </div>
      );
    }

    // --- CLASS FEED COMPONENT ---
    function ClassFeed({ data, setData, role }) {
      const [newPostText, setNewPostText] = useState("");

      const handleAddPost = () => {
        if (!newPostText.trim()) return;
        const newP = {
          id: "p-" + Date.now(),
          author: role === "teacher" ? "Thầy Nguyễn Quốc Cường" : "Nguyễn Văn An",
          role: role === "teacher" ? "Giáo viên" : "Học sinh",
          content: newPostText,
          likes: 0,
          comments: [],
          created_at: "Vừa xong"
        };
        setData(prev => ({ ...prev, posts: [newP, ...prev.posts] }));
        setNewPostText("");
      };

      return (
        <div class="space-y-6 max-w-2xl mx-auto">
          {/* POST CREATE BOX */}
          <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3">
            <textarea
              value={newPostText}
              onChange={(e) => setNewPostText(e.target.value)}
              placeholder="Chia sẻ thảo luận hoặc đặt câu hỏi bài học..."
              class="w-full p-3 rounded-2xl border border-slate-200 text-xs font-medium outline-none focus:border-teal-600 resize-none h-20"
            ></textarea>
            <div class="flex justify-end">
              <button 
                onClick={handleAddPost}
                class="bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-md"
              >
                Đăng Bài
              </button>
            </div>
          </div>

          {/* POSTS LIST */}
          <div class="space-y-4">
            {data.posts.map(p => (
              <div key={p.id} class="bg-white rounded-3xl p-6 border border-slate-200 space-y-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-teal-100 text-teal-800 font-black flex items-center justify-center text-xs">
                      {p.author.slice(0, 2)}
                    </div>
                    <div>
                      <h4 class="font-bold text-slate-900 text-sm">{p.author}</h4>
                      <span class="text-[10px] text-slate-400 font-semibold">{p.role} • {p.created_at}</span>
                    </div>
                  </div>
                </div>

                <p class="text-xs text-slate-700 leading-relaxed font-medium">{p.content}</p>

                <div class="pt-3 border-t border-slate-100 flex items-center gap-4 text-xs font-bold text-slate-500">
                  <button class="flex items-center gap-1 hover:text-rose-600">
                    <i data-lucide="heart" class="w-4 h-4 text-rose-500 fill-rose-500"></i> {p.likes} Yêu thích
                  </button>
                  <span class="flex items-center gap-1">
                    <i data-lucide="message-square" class="w-4 h-4"></i> {p.comments.length} Bình luận
                  </span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // MOUNT REACT APP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
